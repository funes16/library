<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Books</title>
        <!-- Bootstrap 5 CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>
    <body>
<form action="/add" method="POST" class="mb-4">
    <!-- Título -->
    <div class="row mb-3 align-items-center">
        <label for="name" class="col-md-1 col-form-label">Título</label>
        <div class="col-md-5">
            <input type="text" id="name" name="name" class="form-control" placeholder="Título del Libro" required>
        </div>
    </div>

    <!-- Autor -->
    <div class="row mb-3 align-items-center">
        <label for="author" class="col-md-1 col-form-label">Autor</label>
        <div class="col-md-5">
            <input type="text" id="author" name="author" class="form-control" placeholder="Autor" required>
        </div>
    </div>

    <!-- Género -->
    <div class="row mb-3 align-items-center">
        <label for="genre" class="col-md-1 col-form-label">Género</label>
        <div class="col-md-5">
            <input type="text" id="genre" name="genre" class="form-control" placeholder="Género" required>
        </div>
    </div>

    <!-- Botón de envío -->
    <div class="row">
        <div class="col-md-4 offset-md-1">
            <button type="submit" class="btn btn-primary">Agregar Libro</button>
        </div>
    </div>
</form>

<form action="{{ url_for('search_book') }}" method="GET" style="margin-bottom: 30px;">
    <div class="col-md-4 offset-md-1">
        <input type="text" name="query" value="{{ query or '' }}" placeholder="Buscar por codigo, titulo,autor o género">
    </div>
     <div class="row">
        <div class="col-md-4 offset-md-1">
            <button type="submit" class="btn btn-primary">Buscar</button>
        </div>
    </div>
    {% if query %}
        <a href="{{ url_for('index') }}">Limpiar búsqueda</a>
    {% endif %}
</form>

            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">CODE</th>
                        <th scope="col">TITULO</th>
                        <th scope="col">AUTOR</th>
                        <th scope="col">GENERO</th>
                        <th scope="col">ACCIONES</th>
                    </tr>
                </thead>
                <tbody>
                    {%for item in books%}
                    <tr>
                        <th scope="row">{{item[0]}}</th>
                        <td>{{item[1]}}</td>
                        <td>{{item[2]}}</td>
                        <td>{{item[3]}}</td>
                        <td>{{item[4]}}</td>
                        <td>
                            <a href="/edit/{{ item[0] }}" class="btn btn-sm btn-warning">Editar</a>
                            <a href="/delete/{{ item[0] }}" class="btn btn-danger btn-delete">Eliminar</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <!-- Bootstrap 5 JS (opcional, solo si necesitas funcionalidades JS de Bootstrap) -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
            <script src="{{url_for('static', filename='js/main.js')}}"></script>
        </body>
    </html>
